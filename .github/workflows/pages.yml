name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            event-tickets/frontend/package-lock.json
            receivable-desk/frontend/package-lock.json
            invoices/frontend/package-lock.json
            treasury/package-lock.json
            treasury/frontend/package-lock.json
            streampay/frontend/package-lock.json
            grant-receipt/package-lock.json
            record-desk/frontend/package-lock.json
      - name: Install and build tickets
        working-directory: event-tickets/frontend
        env:
          VITE_BASE: /business-ideas/tickets/
          VITE_OVERLAY_URL: https://overlay-us-1.bsvb.tech
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
      - name: Install and build receivables
        working-directory: receivable-desk/frontend
        env:
          VITE_BASE: /business-ideas/receivables/
          VITE_OVERLAY_URL: https://overlay-us-1.bsvb.tech
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
      - name: Install and build invoices
        working-directory: invoices/frontend
        env:
          VITE_BASE: /business-ideas/invoices/
          VITE_OVERLAY_URL: https://overlay-us-1.bsvb.tech
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
      - name: Install and build treasury
        working-directory: treasury/frontend
        env:
          VITE_BASE: /business-ideas/treasury/
          VITE_OVERLAY_URL: https://overlay-us-1.bsvb.tech
        run: |
          npm ci --prefix ..
          npm ci
          npm run build
          cp dist/index.html dist/404.html
      - name: Install and build streampay
        working-directory: streampay/frontend
        env:
          VITE_BASE: /business-ideas/streampay/
          VITE_OVERLAY_URL: https://overlay-us-1.bsvb.tech
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
      - name: Install and build grants
        working-directory: grant-receipt
        env:
          VITE_BASE: /business-ideas/grants/
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
      - name: Install and build records
        working-directory: record-desk/frontend
        env:
          VITE_BASE: /business-ideas/records/
          VITE_OVERLAY_URL: https://overlay-us-1.bsvb.tech
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
      - name: Compose Pages site
        run: |
          mkdir -p site/tickets site/receivables site/invoices site/treasury site/streampay site/grants site/records
          cp pages/index.html pages/styles.css site/
          cp -r event-tickets/frontend/dist/. site/tickets/
          cp -r receivable-desk/frontend/dist/. site/receivables/
          cp -r invoices/frontend/dist/. site/invoices/
          cp -r treasury/frontend/dist/. site/treasury/
          cp -r streampay/frontend/dist/. site/streampay/
          cp -r grant-receipt/dist/. site/grants/
          cp -r record-desk/frontend/dist/. site/records/
          cp invoices/frontend/spa-404.html site/404.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
