<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Invoices</title>
    <script>
      (function () {
        var match = location.pathname.match(/\/invoices\/i\/([0-9a-f]{32})\/?$/i)
        if (match) {
          var tx = new URLSearchParams(location.search).get('tx')
          var hash = '/business-ideas/invoices/#/i/' + match[1].toLowerCase()
          if (tx && /^[0-9a-f]{64}$/i.test(tx)) hash += '?tx=' + tx.toLowerCase()
          location.replace(hash)
          return
        }
        location.replace('/business-ideas/')
      })()
    </script>
  </head>
  <body></body>
</html>
