services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: records
      MYSQL_USER: records
      MYSQL_PASSWORD: records
    ports:
      - "3309:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 8

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27020:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8

  overlay:
    build:
      context: .
      dockerfile: overlay/Dockerfile
    ports:
      - "8083:8080"
    env_file:
      - .env.example
    environment:
      PORT: "8080"
      KNEX_URL: mysql://records:records@mysql:3306/records
      MONGO_URL: mongodb://root:example@mongodb:27017/?authSource=admin
      HOSTING_URL: http://localhost:8083
      HOSTING_FQDN: localhost
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_OVERLAY_URL: http://localhost:8083
        VITE_BASE: /
    ports:
      - "5176:80"
    depends_on:
      - overlay

volumes:
  mysql-data:
  mongo-data:
